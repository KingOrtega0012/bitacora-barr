<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a8641f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)">
<meta name="description" content="Gestión diaria de bar: temperaturas, inventario, entradas, salidas, mermas, checklists e incidencias — offline-first con sincronización en la nube.">
<title>Bitácora de Barra</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitácora">

<link rel="stylesheet" href="css/styles.css">
<style>
  :root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html,body{ height:100%; margin:0; }
  body{ background:var(--bg); }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">B</div>
      <div class="brand-text">
        <b>Bitácora de Barra</b>
        <span style="display:flex;align-items:center;gap:6px">
          <span id="clockLine">—</span>
          <span id="syncStatus" class="sync-badge offline">—</span>
        </span>
      </div>
    </div>
    <button class="user-chip" id="userChipBtn"><span class="dot" id="userInitial">E</span><span id="userNameLbl">Encargado</span></button>
  </header>

  <main id="main"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="dashboard" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>Inicio</button>
    <button data-tab="inventario">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M3 7l2-4h14l2 4M9 11v4M15 11v4"/></svg>Stock</button>
    <button data-tab="historial">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Historial</button>
    <button data-tab="temperaturas">
      <svg viewBox="0 0 24 24"><path d="M10 13.5V4a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0Z"/></svg>Temp.</button>
    <button data-tab="mas">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Más</button>
  </nav>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>
<datalist id="provList"></datalist>

<!-- Configuración (URL/clave de Supabase). Copia config.example.js -> config.js -->
<script src="config.js"></script>

<!-- Cliente oficial de Supabase (UMD). Si no hay red la primera vez que se
     abre sin haber cacheado el Service Worker, la app sigue funcionando
     100% local — SB.isConfigured/SB.client simplemente quedan nulos. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer onerror="console.warn('[Bitácora] No se pudo cargar supabase-js (sin red y sin caché todavía). La app sigue funcionando en modo local.')"></script>

<script src="js/supabaseClient.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/sync.js" defer></script>

<script>
  // Registro del Service Worker (instalación PWA + shell offline).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('[Bitácora] No se pudo registrar el Service Worker:', err);
      });
    });
  }
</script>
</body>
</html>
